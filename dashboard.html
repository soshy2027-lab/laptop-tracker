<!DOCTYPE html>
<html>
<body>

<h2>Add Laptop</h2>

<input id="brand" placeholder="Brand"><br><br>
<input id="model" placeholder="Model"><br><br>
<input id="serial" placeholder="Serial"><br><br>

<button onclick="save()">Save</button>

<hr>

<h2>Saved Laptops</h2>
<div id="list"></div>

<script>

const BASE_URL = window.location.origin;

async function save(){
  await fetch(BASE_URL + "/add-laptop",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      brand: document.getElementById("brand").value,
      model: document.getElementById("model").value,
      serial: document.getElementById("serial").value
    })
  });

  setTimeout(load, 1000);
}

async function load(){
  try{
    const res = await fetch(BASE_URL + "/get-laptops");
    const data = await res.json();

    const list = document.getElementById("list");
    list.innerHTML = "";

    if(data.length === 0){
      list.innerHTML = "<p>No laptops yet</p>";
      return;
    }

    data.forEach(l=>{
      list.innerHTML += `<p>${l.brand} - ${l.model} - ${l.serial}</p>`;
    });

  }catch(e){
    document.getElementById("list").innerHTML = "Error loading data";
  }
}

load();

</script>

</body>
</html>
