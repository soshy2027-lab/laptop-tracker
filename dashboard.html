<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
</head>

<body>

<h1>💻 Laptop Dashboard</h1>

<h2>Add Laptop</h2>

<input id="brand" placeholder="Brand"><br><br>
<input id="model" placeholder="Model"><br><br>
<input id="serial" placeholder="Serial"><br><br>
<input id="processor" placeholder="Processor"><br><br>
<input id="ram" placeholder="RAM"><br><br>
<input id="storage" placeholder="Storage"><br><br>

<button onclick="saveLaptop()">Save Laptop</button>

<hr>

<h2>Your Laptops</h2>
<ul id="list"></ul>

<script>

const user = localStorage.getItem("userEmail");

async function saveLaptop(){
    await fetch("/registerLaptop", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            brand: brand.value,
            model: model.value,
            serial: serial.value,
            processor: processor.value,
            ram: ram.value,
            storage: storage.value,
            owner: user
        })
    });

    loadLaptops();
}

async function loadLaptops(){
    const res = await fetch("/laptops");
    const data = await res.json();

    list.innerHTML = "";

    data
    .filter(l => l.owner === user)
    .forEach(l=>{
        list.innerHTML += `<li>${l.brand} - ${l.serial}</li>`;
    });
}

loadLaptops();

</script>

</body>
</html>
