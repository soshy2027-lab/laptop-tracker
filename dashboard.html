<!DOCTYPE html>
<html>
<body>

<h2>Add Laptop</h2>

<input id="brand" placeholder="Brand"><br><br>
<input id="model" placeholder="Model"><br><br>
<input id="serial" placeholder="Serial"><br><br>

<button onclick="save()">Save</button>

<hr>

<h2>Saved Laptops</h2>
<div id="list"></div>

<script>
async function save(){
  await fetch("/add-laptop",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      brand:brand.value,
      model:model.value,
      serial:serial.value
    })
  });
  load();
}

async function load(){
  const res = await fetch("/get-laptops");
  const data = await res.json();

  list.innerHTML="";
  data.forEach(l=>{
    list.innerHTML += `<p>${l.brand} - ${l.serial}</p>`;
  });
}

load();
</script>

</body>
</html>
