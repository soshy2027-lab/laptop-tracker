<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
</head>

<body>

<h1>💻 Laptop Dashboard</h1>

<h2>Add Laptop</h2>

<form action="/add-laptop" method="POST">
  <input name="brand" placeholder="Brand"><br><br>
  <input name="model" placeholder="Model"><br><br>
  <input name="serial" placeholder="Serial"><br><br>
  <input name="processor" placeholder="Processor"><br><br>
  <input name="ram" placeholder="RAM"><br><br>
  <input name="storage" placeholder="Storage"><br><br>

  <button type="submit">Save Laptop</button>
</form>

<hr>

<h2>Your Laptops</h2>

<div id="laptopList"></div>

<script>
async function loadLaptops() {
  const res = await fetch("/get-laptops");
  const laptops = await res.json();

  const container = document.getElementById("laptopList");
  container.innerHTML = "";

  laptops.forEach(l => {
    container.innerHTML += `
      <div>
        <p><b>${l.brand}</b> - ${l.model}</p>
        <p>Serial: ${l.serial}</p>
        <hr/>
      </div>
    `;
  });
}

loadLaptops();
</script>

</body>
</html>
