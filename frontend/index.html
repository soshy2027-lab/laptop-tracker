<!DOCTYPE html>
<html>
<head>
    <title>Laptop Tracker | Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            padding: 20px;
        }
        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid gray;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Login</h2>
        <input id="email" type="text" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p style="text-align:center; margin-top:15px;">
            No account? <a href="#" onclick="showSignup()">Create one</a>
        </p>
    </div>

    <script>
        function login() {
            alert("Login will connect to backend soon...");
        }

        function showSignup() {
            alert("Signup page coming next...");
        }
    </script>
</body>
</html>
