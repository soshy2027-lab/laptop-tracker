<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laptop Tracker - Admin Panel</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <style>
    :root { 
      --primary:#2563eb; --danger:#dc2626; --bg:#f3f4f6; --card:#fff; --text:#1f2937; --light:#6b7280; --border:#e5e7eb; 
      --stat-blue-bg:#e0f2fe; --stat-blue-text:#0369a1;
    }
    [data-theme="dark"] {
      --bg:#121212; --card:#1e1e1e; --text:#e0e0e0; --light:#a0a0a0; --border:#333;
      --stat-blue-bg:#1e3a8a; --stat-blue-text:#93c5fd;
    }
    body { font-family:'Segoe UI',Tahoma,sans-serif; background:var(--bg); color:var(--text); margin:0; padding:20px; transition:background 0.3s, color 0.3s; }
    .wrap { max-width:1100px; margin:0 auto; }
    .header { display:flex; align-items:center; justify-content:space-between; background:var(--card); padding:15px 20px; border-radius:12px; box-shadow:0 4px 6px rgba(0,0,0,0.05); margin-bottom:20px; flex-wrap:wrap; gap:10px; }
    .logo-area { display:flex; align-items:center; gap:12px; }
    .logo-area img { height:45px; width:45px; object-fit:contain; }
    .logo-area h1 { margin:0; font-size:1.4rem; color:var(--primary); }
    .btn { padding:8px 14px; border-radius:8px; border:none; cursor:pointer; font-weight:600; }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-out { background:#374151; color:#fff; }
    .btn-danger { background:var(--danger); color:#fff; }
    .btn-stolen { background:#f59e0b; color:#fff; }
    .tabs { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
    .tab { background:var(--card); border:1px solid var(--border); padding:10px 16px; border-radius:8px; cursor:pointer; font-weight:500; transition:0.2s; }
    .tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .card { background:var(--card); padding:20px; border-radius:12px; box-shadow:0 4px 6px rgba(0,0,0,0.05); margin-bottom:20px; }
    .card h2 { margin:0 0 15px; font-size:1.2rem; border-bottom:2px solid var(--border); padding-bottom:10px; }
    table { width:100%; border-collapse:collapse; font-size:0.9rem; }
    th,td { padding:12px 10px; text-align:left; border-bottom:1px solid var(--border); }
    th { background:var(--bg); font-weight:600; color:var(--light); }
    .badge { padding:4px 8px; border-radius:12px; font-size:0.8rem; font-weight:600; }
    .badge-admin { background:#dbeafe; color:#1e40af; }
    .badge-user { background:#f3f4f6; color:#374151; }
    .badge-stolen { background:#fee2e2; color:#b91c1c; }
    .badge-active { background:#dcfce7; color:#15803d; }
    .empty { text-align:center; padding:30px; color:var(--light); }
    @media(max-width:600px) { th,td { font-size:0.8rem; padding:8px 5px; } .btn { font-size:0.8rem; padding:6px 10px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="logo-area"><img src="/logo.png" alt="Logo"><h1>Admin Panel</h1></div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-primary" onclick="window.location.href='/dashboard'">📊 User Dashboard</button>
        <button class="btn btn-out" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="showTab('users')">👥 All Users</button>
      <button class="tab" onclick="showTab('laptops')">💻 All Laptops</button>
      <button class="tab" onclick="showTab('stolen')">🚨 Stolen Devices</button>
    </div>

    <div id="users-section" class="card">
      <h2>Registered Users</h2>
      <div id="users-table-container"></div>
    </div>

    <div id="laptops-section" class="card" style="display:none;">
      <h2>Global Laptop Management</h2>
      <div id="laptops-table-container"></div>
    </div>

    <div id="stolen-section" class="card" style="display:none;">
      <h2>Stolen Device Tracker</h2>
      <div id="stolen-table-container"></div>
    </div>
  </div>

  <script>
    // AUTH CHECK
    const token = localStorage.getItem('token');
    if(!token) window.location.href='/';
    let currentUser;
    try {
      currentUser = JSON.parse(atob(token));
    } catch { window.location.href='/'; }

    if(currentUser.email !== 'admin@laptoptracker.com' || currentUser.role !== 'admin') {
      alert('Admin access only. Redirecting to dashboard.');
      window.location.href='/dashboard';
    }

    const auth = { 'Authorization': `Bearer ${token}` };

    // TAB SWITCHING
    window.showTab = (tab) => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('users-section').style.display = tab === 'users' ? 'block' : 'none';
      document.getElementById('laptops-section').style.display = tab === 'laptops' ? 'block' : 'none';
      document.getElementById('stolen-section').style.display = tab === 'stolen' ? 'block' : 'none';
    };

    // FETCH DATA
    async function loadUsers() {
      const res = await fetch('/api/admin/users', { headers: auth });
      if(!res.ok) return;
      const users = await res.json();
      const container = document.getElementById('users-table-container');
      if(users.length === 0) return container.innerHTML = '<div class="empty">No users registered yet.</div>';
      
      let html = '<table><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>';
      users.forEach(u => {
        html += `<tr><td>${u.name}</td><td>${u.email}</td><td><span class="badge ${u.role==='admin'?'badge-admin':'badge-user'}">${u.role}</span></td></tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    async function loadLaptops() {
      const res = await fetch('/api/admin/laptops', { headers: auth });
      if(!res.ok) return;
      const laptops = await res.json();
      const container = document.getElementById('laptops-table-container');
      if(laptops.length === 0) return container.innerHTML = '<div class="empty">No laptops in system.</div>';

      let html = '<table><thead><tr><th>Owner</th><th>Brand/Model</th><th>Serial</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
      laptops.forEach(l => {
        const stolenBadge = l.stolen ? '<span class="badge badge-stolen">🚨 Stolen</span>' : '<span class="badge badge-active">Active</span>';
        html += `<tr>
          <td>${l.ownerName}<br><small style="color:#666">${l.ownerEmail}</small></td>
          <td>${l.brand} ${l.model}</td>
          <td>${l.serialNumber}</td>
          <td>${stolenBadge}</td>
          <td>
            <button class="btn btn-stolen" onclick="toggleStolen('${l.id}', ${!l.stolen})">${l.stolen ? '✅ Restore' : ' Mark Stolen'}</button>
            <button class="btn btn-danger" onclick="adminDelete('${l.id}')">🗑️ Delete</button>
          </td>
        </tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    async function loadStolen() {
      const res = await fetch('/api/admin/stolen', { headers: auth });
      if(!res.ok) return;
      const laptops = await res.json();
      const container = document.getElementById('stolen-table-container');
      if(laptops.length === 0) return container.innerHTML = '<div class="empty">No stolen devices reported. ✅</div>';

      let html = '<table><thead><tr><th>Owner</th><th>Device</th><th>Serial</th><th>Reported</th><th>Action</th></tr></thead><tbody>';
      laptops.forEach(l => {
        html += `<tr>
          <td>${l.ownerName}<br><small>${l.ownerEmail}</small></td>
          <td>${l.brand} ${l.model}</td>
          <td>${l.serialNumber}</td>
          <td>🚨 YES</td>
          <td><button class="btn btn-primary" onclick="toggleStolen('${l.id}', false)">✅ Mark Recovered</button></td>
        </tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    // ACTIONS
    window.toggleStolen = async(id, status) => {
      if(!confirm(`Mark this laptop as ${status ? 'STOLEN' : 'RECOVERED'}?`)) return;
      const res = await fetch(`/api/laptops/${id}/stolen`, {
        method: 'PUT', headers: {...auth, 'Content-Type':'application/json'},
        body: JSON.stringify({ stolen: status })
      });
      if(res.ok) { loadLaptops(); loadStolen(); }
      else alert('Failed to update status');
    };

    window.adminDelete = async(id) => {
      if(!confirm('Permanently delete this laptop from the system?')) return;
      const res = await fetch(`/api/admin/laptops/${id}`, { method:'DELETE', headers:auth });
      if(res.ok) { loadLaptops(); loadStolen(); }
      else alert('Failed to delete');
    };

    window.logout = () => {
      localStorage.removeItem('token');
      window.location.href='/';
    };

    // INIT
    loadUsers();
    loadLaptops();
    loadStolen();
  </script>
</body>
</html>
