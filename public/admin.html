<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Laptop Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #e5e7eb;
    }
    .header h1 { color: #2563eb; }
    .btn-logout {
      padding: 10px 20px;
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab {
      padding: 12px 24px;
      background: #f3f4f6;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: #6b7280;
    }
    .tab.active {
      background: #2563eb;
      color: white;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
    }
    th {
      background: #f9fafb;
      font-weight: 600;
      color: #374151;
    }
    .badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .badge-trial { background: #fef3c7; color: #92400e; }
    .badge-active { background: #d1fae5; color: #065f46; }
    .badge-expired { background: #fee2e2; color: #991b1b; }
    .badge-stolen { background: #fee2e2; color: #dc2626; font-weight: bold; }
    .error {
      background: #fee2e2;
      color: #dc2626;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      margin: 40px 0;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔐 Admin Panel</h1>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <div id="errorBox" class="error" style="display:none;"></div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('users')">👥 Users</button>
      <button class="tab" onclick="switchTab('laptops')">💻 All Laptops</button>
      <button class="tab" onclick="switchTab('stolen')">🚨 Stolen Devices</button>
    </div>

    <div id="usersTab" class="tab-content active">
      <h2>Registered Users</h2>
      <div id="usersList" class="loading">Loading...</div>
    </div>

    <div id="laptopsTab" class="tab-content">
      <h2>All Laptops</h2>
      <div id="laptopsList" class="loading">Loading...</div>
    </div>

    <div id="stolenTab" class="tab-content">
      <h2>🚨 Stolen Devices</h2>
      <div id="stolenList" class="loading">Loading...</div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    
    // Check if logged in
    if (!token) {
      window.location.href = '/';
    }

    // Verify admin role
    async function checkAdmin() {
      try {
        const res = await fetch('/api/admin/users', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 403) {
          alert('Admin access required!');
          window.location.href = '/dashboard';
          return false;
        }
        if (!res.ok) throw new Error('Not authorized');
        return true;
      } catch (err) {
        window.location.href = '/';
        return false;
      }
    }

    async function loadUsers() {
      try {
        const res = await fetch('/api/admin/users', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const users = await res.json();
        const div = document.getElementById('usersList');
        
        if (users.length === 0) {
          div.innerHTML = '<p style="padding:20px;text-align:center;color:#6b7280;">No users yet.</p>';
          return;
        }

        let html = '<table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Subscription</th></tr></thead><tbody>';
        users.forEach(u => {
          const subStatus = u.subscription.status === 'trial' ? 'Trial' : u.subscription.status === 'active' ? 'Active' : 'Expired';
          const badgeClass = u.subscription.status === 'trial' ? 'badge-trial' : u.subscription.status === 'active' ? 'badge-active' : 'badge-expired';
          html += `<tr>
            <td>${u.name}</td>
            <td>${u.email}</td>
            <td>${u.role === 'admin' ? '🔑 Admin' : 'User'}</td>
            <td><span class="badge ${badgeClass}">${subStatus}</span></td>
          </tr>`;
        });
        html += '</tbody></table>';
        div.innerHTML = html;
      } catch (err) {
        document.getElementById('usersList').innerHTML = '<p style="padding:20px;text-align:center;color:#dc2626;">Failed to load users</p>';
      }
    }

    async function loadLaptops() {
      try {
        const res = await fetch('/api/admin/laptops', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const laptops = await res.json();
        const div = document.getElementById('laptopsList');
        
        if (laptops.length === 0) {
          div.innerHTML = '<p style="padding:20px;text-align:center;color:#6b7280;">No laptops registered yet.</p>';
          return;
        }

        let html = '<table><thead><tr><th>Owner</th><th>Brand</th><th>Model</th><th>Serial</th><th>Status</th></tr></thead><tbody>';
        laptops.forEach(l => {
          const statusClass = l.stolen ? 'badge-stolen' : 'badge-active';
          html += `<tr>
            <td>${l.ownerName || 'Unknown'}</td>
            <td>${l.brand}</td>
            <td>${l.model}</td>
            <td>${l.serialNumber}</td>
            <td><span class="badge ${statusClass}">${l.stolen ? 'STOLEN' : l.status}</span></td>
          </tr>`;
        });
        html += '</tbody></table>';
        div.innerHTML = html;
      } catch (err) {
        document.getElementById('laptopsList').innerHTML = '<p style="padding:20px;text-align:center;color:#dc2626;">Failed to load laptops</p>';
      }
    }

    async function loadStolen() {
      try {
        const res = await fetch('/api/admin/stolen', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const laptops = await res.json();
        const div = document.getElementById('stolenList');
        
        if (laptops.length === 0) {
          div.innerHTML = '<p style="padding:20px;text-align:center;color:#6b7280;">No stolen devices reported. Great! 🎉</p>';
          return;
        }

        let html = '<table><thead><tr><th>Owner</th><th>Brand</th><th>Model</th><th>Serial</th><th>Reported</th></tr></thead><tbody>';
        laptops.forEach(l => {
          const reportedDate = l.reportedStolenAt ? new Date(l.reportedStolenAt).toLocaleString() : 'Unknown';
          html += `<tr>
            <td>${l.ownerName || 'Unknown'}</td>
            <td>${l.brand}</td>
            <td>${l.model}</td>
            <td>${l.serialNumber}</td>
            <td>${reportedDate}</td>
          </tr>`;
        });
        html += '</tbody></table>';
        div.innerHTML = html;
      } catch (err) {
        document.getElementById('stolenList').innerHTML = '<p style="padding:20px;text-align:center;color:#dc2626;">Failed to load stolen devices</p>';
      }
    }

    window.switchTab = (tab) => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tab + 'Tab').classList.add('active');
      
      if (tab === 'users') loadUsers();
      if (tab === 'laptops') loadLaptops();
      if (tab === 'stolen') loadStolen();
    };

    window.logout = () => {
      localStorage.removeItem('token');
      window.location.href = '/';
    };

    // Initialize
    (async () => {
      const isAdmin = await checkAdmin();
      if (isAdmin) {
        loadUsers();
      }
    })();
  </script>
</body>
</html>
