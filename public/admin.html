<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Laptop Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f3f4f6;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid #e5e7eb;
    }
    .header h1 { color: #2563eb; font-size: 1.5rem; }
    .btn-logout {
      background: #dc2626;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab {
      flex: 1;
      padding: 12px;
      background: #e5e7eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      text-align: center;
    }
    .tab.active { background: #2563eb; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .stat-card {
      background: #eff6ff;
      border-left: 4px solid #2563eb;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .stat-card h3 { color: #1e40af; font-size: 0.9rem; margin-bottom: 5px; }
    .stat-card p { font-size: 1.5rem; font-weight: bold; color: #1e3a8a; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { background: #f9fafb; font-weight: 600; }
    .badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .badge-active { background: #d1fae5; color: #065f46; }
    .badge-expired { background: #fee2e2; color: #991b1b; }
    .badge-trial { background: #fef3c7; color: #92400e; }
    .loading { text-align: center; padding: 40px; color: #6b7280; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔐 Admin Dashboard</h1>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <div id="errorBox" style="display:none; color:#dc2626; background:#fee2e2; padding:15px; border-radius:8px; margin-bottom:20px; text-align:center;"></div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('users')">👥 Users</button>
      <button class="tab" onclick="switchTab('laptops')">📱 Devices</button>
      <button class="tab" onclick="switchTab('stolen')">🚨 Stolen</button>
    </div>

    <div id="usersTab" class="tab-content active">
      <div class="stat-card">
        <h3>Total Registered Users</h3>
        <p id="userCount">...</p>
      </div>
      <div id="usersList" class="loading">Loading Users...</div>
    </div>

    <div id="laptopsTab" class="tab-content">
      <div class="stat-card">
        <h3>Total Laptops</h3>
        <p id="laptopCount">...</p>
      </div>
      <div id="laptopsList" class="loading">Loading Laptops...</div>
    </div>

    <div id="stolenTab" class="tab-content">
      <div class="stat-card" style="background:#fef2f2; border-left-color:#dc2626;">
        <h3>Reported Stolen Devices</h3>
        <p id="stolenCount" style="color:#991b1b">...</p>
      </div>
      <div id="stolenList" class="loading">Loading Stolen Reports...</div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    
    // SECURITY CHECK: Redirect immediately if no token
    if (!token) {
      window.location.href = '/';
    }

    // VERIFY ADMIN STATUS
    async function verifyAdmin() {
      try {
        const res = await fetch('/api/admin/users', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 403) {
          alert('❌ Access Denied: Admin privileges required.');
          window.location.href = '/dashboard';
          return false;
        }
        if (!res.ok) throw new Error('Verification failed');
        return true;
      } catch (err) {
        window.location.href = '/';
        return false;
      }
    }

    // LOAD DATA
    async function loadData(type) {
      try {
        let url = `/api/admin/${type}`;
        const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        
        if (type === 'users') {
          document.getElementById('userCount').textContent = data.length;
          let html = '<table><thead><tr><th>Name</th><th>Email</th><th>Status</th></tr></thead><tbody>';
          data.forEach(u => {
            let statusClass = u.isSubscribed ? 'badge-active' : 'badge-expired';
            let statusText = u.isSubscribed ? 'ACTIVE' : 'EXPIRED';
            html += `<tr><td>${u.name || 'No Name'}</td><td>${u.email || 'No Email'}</td><td><span class="badge ${statusClass}">${statusText}</span></td><td><button onclick="deleteUser('${u._id}', '${u.name}')" style="background:#dc2626;color:white;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:0.75rem;">Delete</button></td></tr>`;
          });
          html += '</tbody></table>';
          document.getElementById('usersList').innerHTML = html;
        } 
        else if (type === 'laptops') {
          document.getElementById('laptopCount').textContent = data.length;
          let html = '<table><thead><tr><th>Type</th><th>Owner</th><th>Brand/Model</th><th>Serial</th><th>Status</th></tr></thead><tbody>';
          data.forEach(l => {
            html += `<tr><td>${l.ownerName || 'Unknown'}</td><td>${l.brand} ${l.model}</td><td>${l.serial}</td><td>${l.stolen ? '🚨 STOLEN' : '✅ Active'}</td></tr>`;
          });
          html += '</tbody></table>';
          document.getElementById('laptopsList').innerHTML = html;
        } 
        else if (type === 'stolen') {
          document.getElementById('stolenCount').textContent = data.length;
          if (data.length === 0) {
            document.getElementById('stolenList').innerHTML = '<p style="padding:20px;text-align:center;color:#6b7280;"> No stolen devices reported!</p>';
          } else {
            let html = '<table><thead><tr><th>Owner</th><th>Device</th><th>Date Reported</th></tr></thead><tbody>';
            data.forEach(l => {
              let date = l.reportedStolenAt ? new Date(l.reportedStolenAt).toLocaleDateString() : 'Unknown';
              html += `<tr><td>${l.ownerName || 'Unknown'}</td><td>${l.brand} ${l.model}</td><td>${date}</td></tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('stolenList').innerHTML = html;
          }
        }
      } catch (err) {
        document.getElementById(type + 'List').innerHTML = '<p style="color:red;text-align:center;">Error loading data</p>';
      }
    }

    window.switchTab = (tab) => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tab + 'Tab').classList.add('active');
      loadData(tab);
    };

    window.logout = () => {
      localStorage.removeItem('token');
      window.location.href = '/';
    };

    // INITIALIZE
    (async () => {
      const isAdmin = await verifyAdmin();
      if (isAdmin) {
        loadData('users');
      }
    })();
  
    window.deleteUser = (userId, userName) => {
      if (!confirm(`⚠️ Are you sure you want to delete user "${userName}"?\n\nThis will also delete all their laptops. This action cannot be undone!`)) return;
      
      fetch('/api/admin/user/' + userId, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(res => res.json())
      .then(data => {
        alert('✅ ' + data.message);
        loadData('users');
      })
      .catch(err => {
        alert('❌ Error deleting user: ' + err.message);
      });
    };
</script>
</body>
</html>
