<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Laptop Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%; max-width: 500px; padding: 40px; }
    .logo { text-align: center; margin-bottom: 30px; }
    .logo img { width: 80px; height: 80px; border-radius: 12px; }
    h1 { color: #333; text-align: center; margin-bottom: 10px; font-size: 28px; }
    .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; font-size: 14px; }
    input, textarea, select { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; transition: border 0.3s; font-family: inherit; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #667eea; }
    textarea { resize: vertical; min-height: 120px; }
    .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s; margin-top: 10px; }
    .btn-submit:hover { transform: translateY(-2px); }
    .btn-submit:active { transform: translateY(0); }
    .back-link { text-align: center; margin-top: 20px; }
    .back-link a { color: #667eea; text-decoration: none; font-weight: 600; }
    .back-link a:hover { text-decoration: underline; }
    #msg { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; display: none; }
    .success { background: #d1fae5; color: #065f46; }
    .error { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="/logo.png" alt="Laptop Tracker" onerror="this.style.display='none'">
    </div>
    <h1>Contact Us</h1>
    <p class="subtitle">Have a question? We'd love to hear from you.</p>
    
    <form id="contactForm">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required>
      </div>
      
      <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      
      <div class="form-group">
        <label for="subject">Subject</label>
        <select id="subject" name="subject" required>
          <option value="">Select a subject...</option>
          <option value="General Inquiry">General Inquiry</option>
          <option value="Technical Support">Technical Support</option>
          <option value="Billing Question">Billing Question</option>
          <option value="Feature Request">Feature Request</option>
          <option value="Report a Bug">Report a Bug</option>
          <option value="Other">Other</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="How can we help you?" required></textarea>
      </div>
      
      <button type="submit" class="btn-submit">📧 Send Message</button>
      <div id="msg"></div>
    </form>
    
    <div class="back-link">
      <a href="javascript:history.back()">← Go Back</a>
    </div>
  </div>

  <script>
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const btn = document.querySelector('.btn-submit');
      
      btn.textContent = 'Sending...';
      btn.disabled = true;
      
      try {
        const res = await fetch('/api/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            subject: document.getElementById('subject').value,
            message: document.getElementById('message').value
          })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          msg.textContent = '✅ Message sent successfully! We will get back to you soon.';
          msg.className = 'success';
          msg.style.display = 'block';
          document.getElementById('contactForm').reset();
        } else {
          msg.textContent = '❌ ' + (data.error || 'Failed to send message');
          msg.className = 'error';
          msg.style.display = 'block';
        }
      } catch (err) {
        msg.textContent = '❌ Network error. Please try again.';
        msg.className = 'error';
        msg.style.display = 'block';
      }
      
      btn.textContent = '📧 Send Message';
      btn.disabled = false;
    });
  </script>
</body>
</html>
