<!DOCTYPE html>
<html>
<head>
    <title>Laptop Tracker</title>
</head>
<body>

<h2>Laptop Registration</h2>

<form>
    <label>Laptop Brand</label><br>
    <input type="text" placeholder="HP"><br><br>

    <label>Model</label><br>
    <input type="text" placeholder="Latitude 5420"><br><br>

    <label>Serial Number</label><br>
    <input type="text" placeholder="DL5420-KE-23901"><br><br>

    <label>Processor</label><br>
    <input type="text" placeholder="Intel Core i5"><br><br>

    <label>RAM</label><br>
    <input type="text" placeholder="8GB"><br><br>

    <label>Storage</label><br>
    <input type="text" placeholder="256GB"><br><br>

    <button type="submit">Submit</button>
</form>

</body>
</html>
