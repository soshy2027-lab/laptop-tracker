<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laptop Tracker - Login</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }
    
    /* LOADING SPINNER */
    #loader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #fff; z-index: 9999; display: flex;
      align-items: center; justify-content: center; transition: opacity 0.5s ease;
    }
    .spinner {
      width: 50px; height: 50px; border: 5px solid #e5e7eb;
      border-top: 5px solid #2563eb; border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      position: relative;
      z-index: 10;
    }
    .logo-img { width: 80px; height: 80px; margin: 0 auto 15px; object-fit: contain; }
    h1 { color: #2563eb; margin-bottom: 5px; font-size: 1.5rem; }
    p.subtitle { color: #6b7280; margin-bottom: 25px; font-size: 0.9rem; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab {
      flex: 1; padding: 10px; background: #f3f4f6; border: none;
      border-radius: 8px; cursor: pointer; font-weight: 600; color: #6b7280;
    }
    .tab.active { background: #2563eb; color: white; }
    
    .form-group { margin-bottom: 15px; text-align: left; position: relative; }
    .form-group label { display: block; margin-bottom: 5px; color: #374151; font-size: 0.9rem; }
    .form-group input {
      width: 100%; padding: 12px; border: 2px solid #e5e7eb;
      border-radius: 8px; font-size: 1rem;
    }
    .form-group input:focus { outline: none; border-color: #2563eb; }
    
    /* PASSWORD STRENGTH METER */
    .strength-meter {
      height: 5px; background: #e5e7eb; border-radius: 5px;
      margin-top: 5px; overflow: hidden; transition: background 0.3s;
    }
    .strength-fill {
      height: 100%; width: 0%; transition: width 0.3s, background 0.3s;
    }
    .strength-text {
      font-size: 0.75rem; margin-top: 3px; color: #6b7280; text-align: right;
    }

    .toggle-password {
      position: absolute; right: 12px; top: 38px;
      background: none; border: none; cursor: pointer; font-size: 1.2rem; color: #6b7280;
    }
    
    .btn-primary {
      width: 100%; padding: 14px; background: #2563eb; color: white;
      border: none; border-radius: 10px; font-size: 1rem; font-weight: 600;
      cursor: pointer; margin-bottom: 15px;
    }
    .btn-primary:hover { background: #1d4ed8; }
    
    .divider { display: flex; align-items: center; margin: 20px 0; color: #9ca3af; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e5e7eb; }
    .divider span { padding: 0 10px; }
    
    .hidden { display: none; }
    .error-msg { color: #dc2626; background: #fee2e2; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; }
    
    .footer-links {
      margin-top: 30px; padding-top: 20px; border-top: 1px solid #e5e7eb;
      display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;
    }
    .footer-links a { color: #6b7280; text-decoration: none; font-size: 0.85rem; font-weight: 500; }
    
    /* INSTALL BANNER */
    .install-banner {
      position: fixed; bottom: 0; left: 0; width: 100%;
      background: #2563eb; color: white; padding: 15px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 1000; box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
    }
    .install-banner button {
      background: white; color: #2563eb; border: none;
      padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;
    }
    .install-banner .close-banner {
      background: none; color: white; margin-left: 10px; font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <!-- LOADER -->
  <div id="loader"><div class="spinner"></div></div>

  <!-- INSTALL BANNER -->
  <div id="install-banner" class="install-banner" style="display:none;">
    <span>📱 Install Laptop Tracker App</span>
    <div>
      <button onclick="installApp()">Install</button>
      <button class="close-banner" onclick="document.getElementById('install-banner').style.display='none'">×</button>
    </div>
  </div>

  <div class="container">
    <img src="logo.png" alt="Logo" class="logo-img">
    <h1>Laptop Tracker</h1>
    <p class="subtitle">Track. Protect. Recover.</p>

    <div id="errorBox" class="error-msg hidden"></div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="••••••••">
        <button type="button" class="toggle-password" onclick="togglePass('loginPass', this)">👁️</button>
      </div>
      <button class="btn-primary" onclick="handleLogin()">Login</button>
<div id="auth-extras" style="margin-top: 15px; text-align: center;">
    <button id="show-forgot-btn" class="link-btn" style="background: none; border: none; color: #2563eb; cursor: pointer; text-decoration: underline; font-size: 14px; padding: 0; display: none;">Forgot Password?</button>
    <div id="forgot-form" class="auth-form" style="display: none; margin-top: 15px;">
        <p style="font-size: 14px; margin-bottom: 10px;">Enter your email to receive a reset link.</p>
        <input type="email" id="forgot-email" placeholder="Enter your email" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
        <button onclick="handleForgot()" class="btn-primary" style="width: 100%;">Send Reset Link</button>
        <p id="forgot-msg" style="margin-top: 10px; font-size: 14px;"></p>
        <button class="link-btn" onclick="showLogin()" style="background: none; border: none; color: #2563eb; cursor: pointer; text-decoration: underline; font-size: 14px; margin-top: 10px;">Back to Login</button>
    </div>
    <div id="reset-form" class="auth-form" style="display: none; margin-top: 15px;">
        <p style="font-size: 14px; margin-bottom: 10px;">Enter your new password.</p>
        <input type="password" id="new-password" placeholder="New Password" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
        <button onclick="handleReset()" class="btn-primary" style="width: 100%;">Update Password</button>
        <p id="reset-msg" style="margin-top: 10px; font-size: 14px;"></p>
    </div>
</div>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const resetToken = urlParams.get('token');

  if (resetToken) {
    document.getElementById('reset-form').style.display = 'block';
    document.getElementById('show-forgot-btn').style.display = 'none';
  } else {
    if(!localStorage.getItem('token')) {
       document.getElementById('show-forgot-btn').style.display = 'inline-block';
    }
  }

  document.getElementById('show-forgot-btn').addEventListener('click', () => {
    document.getElementById('forgot-form').style.display = 'block';
    document.getElementById('show-forgot-btn').style.display = 'none';
  });

  function showLogin() {
    document.getElementById('forgot-form').style.display = 'none';
    document.getElementById('show-forgot-btn').style.display = 'inline-block';
  }

  async function handleForgot() {
    const email = document.getElementById('forgot-email').value;
    const msg = document.getElementById('forgot-msg');
    msg.innerText = 'Sending...';
    try {
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      msg.innerText = data.message || data.error;
      msg.style.color = res.ok ? 'green' : 'red';
    } catch (e) {
      msg.innerText = 'Network error';
      msg.style.color = 'red';
    }
  }

  async function handleReset() {
    const newPassword = document.getElementById('new-password').value;
    const msg = document.getElementById('reset-msg');
    msg.innerText = 'Updating...';
    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: resetToken, newPassword })
      });
      const data = await res.json();
      msg.innerText = data.message || data.error;
      msg.style.color = res.ok ? 'green' : 'red';
      if(res.ok) setTimeout(() => window.location.href = '/', 2000);
    } catch (e) {
      msg.innerText = 'Network error';
      msg.style.color = 'red';
    }
  }
</script>

      <div class="divider"><span>OR</span></div>
      <div id="g_id_onload" data-client_id="725032797775-iam91nooik7abniqg41hjejso90f2asr.apps.googleusercontent.com" data-callback="handleGoogleCredentialResponse" data-auto_prompt="false"></div>
      <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="large" data-logo_alignment="left"></div>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" class="hidden">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPass" placeholder="••••••••" oninput="checkStrength()">
        <button type="button" class="toggle-password" onclick="togglePass('regPass', this)">👁️</button>
        
        <!-- PASSWORD STRENGTH METER -->
        <div class="strength-meter"><div id="strength-fill" class="strength-fill"></div></div>
        <div id="strength-text" class="strength-text"></div>
      </div>
      <button class="btn-primary" onclick="handleRegister()">Create Account</button>
    </div>

      <div style="text-align: center; margin-top: 20px; font-size: 12px; color: #888;">
        © 2026 Laptop Tracker. All rights reserved.
      </div>
      <div style="display: flex; justify-content: center; gap: 15px; margin-top: 10px;">
        <a href="/important.html" style="color: #666; text-decoration: none; font-size: 12px;">Important</a>
        <a href="/terms.html" style="color: #666; text-decoration: none; font-size: 12px;">Terms</a>
        <a href="/about.html" style="color: #666; text-decoration: none; font-size: 12px;">About</a>
      </div>
    <div class="footer-links">
      <a href="/important.html">Important</a>
      <a href="/terms.html">Terms</a>
      <a href="/about.html">About</a>
    </div>
  </div>

  <script>
    // HIDE LOADER
    window.addEventListener('load', () => {
      const loader = document.getElementById('loader');
      loader.style.opacity = '0';
      setTimeout(() => loader.style.display = 'none', 500);
    });

    // INSTALL PROMPT LOGIC
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      setTimeout(() => {
        document.getElementById('install-banner').style.display = 'flex';
      }, 2000);
    });

    window.installApp = () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((result) => {
          if (result.outcome === 'accepted') {
            document.getElementById('install-banner').style.display = 'none';
          }
          deferredPrompt = null;
        });
      }
    };

    // PASSWORD STRENGTH CHECK
    window.checkStrength = () => {
      const val = document.getElementById('regPass').value;
      const fill = document.getElementById('strength-fill');
      const text = document.getElementById('strength-text');
      
      let strength = 0;
      if (val.length >= 6) strength++;
      if (val.match(/[a-z]/) && val.match(/[A-Z]/)) strength++;
      if (val.match(/\d/)) strength++;
      if (val.match(/[^a-zA-Z\d]/)) strength++;

      const colors = ['#dc2626', '#f59e0b', '#10b981', '#059669'];
      const labels = ['Weak', 'Fair', 'Good', 'Strong'];
      
      fill.style.width = (strength * 25) + '%';
      fill.style.background = colors[strength - 1] || '#e5e7eb';
      text.textContent = val.length > 0 ? labels[strength - 1] || 'Too Short' : '';
      text.style.color = colors[strength - 1] || '#6b7280';
    };

    window.togglePass = (id, btn) => {
      const input = document.getElementById(id);
      if (input.type === "password") { input.type = "text"; btn.textContent = "🙈"; }
      else { input.type = "password"; btn.textContent = "👁️"; }
    };

    window.switchTab = (tab) => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
      document.getElementById('errorBox').classList.add('hidden');
    };

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg; box.classList.remove('hidden');
    }

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPass').value;
      if (!email || !password) return showError("Please fill in all fields");
      try {
        const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const data = await res.json();
        if (res.ok) { localStorage.setItem('token', data.token); window.location.href = '/dashboard'; }
        else showError(data.error);
      } catch (err) { showError("Network error"); }
    }

    async function handleRegister() {
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPass').value;
      if (!name || !email || !password) return showError("Please fill in all fields");
      try {
        const res = await fetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, email, password }) });
        const data = await res.json();
        if (res.ok) { 
          localStorage.setItem('token', data.token); 
          // SHOW ALERT INSTRUCTING USER TO CHECK EMAIL
          alert(`✅ Account created successfully!\n\n Please check your email (${email}) to verify your account.`);
          window.location.href = '/dashboard'; 
        }
        else showError(data.error);
      } catch (err) { showError("Network error"); }
    }

    async function handleGoogleCredentialResponse(response) {
      try {
        const res = await fetch('/api/auth/google', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credential: response.credential }) });
        const data = await res.json();
        if (res.ok) { localStorage.setItem('token', data.token); window.location.href = '/dashboard'; }
        else showError("Google login failed");
      } catch (err) { showError("Network error"); }
    }
  </script>



</body>
</html>
