<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laptop Tracker - Login</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* LOADER STYLES */
    #page-loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    .loader-content {
      text-align: center;
      position: relative;
    }
    .loader-ring {
      width: 110px;
      height: 110px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #fff;
      border-radius: 50%;
      animation: spin 1.2s linear infinite;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .loader-logo {
      width: 65px;
      height: 65px;
      object-fit: contain;
      position: relative;
      z-index: 1;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .loader-text {
      color: white;
      margin-top: 25px;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 1px;
      animation: fadeText 2s ease-in-out infinite;
    }
    @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.9; } }
    @keyframes fadeText { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

    /* EXISTING STYLES */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    .logo-img {
      width: 80px;
      height: 80px;
      margin: 0 auto 15px;
      object-fit: contain;
    }
    h1 { 
      color: #2563eb;
      margin-bottom: 5px; 
      font-size: 1.5rem; 
    }
    p.subtitle { color: #6b7280; margin-bottom: 25px; font-size: 0.9rem; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab {
      flex: 1;
      padding: 10px;
      background: #f3f4f6;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: #6b7280;
    }
    .tab.active { background: #2563eb; color: white; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; margin-bottom: 5px; color: #374151; font-size: 0.9rem; }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
    }
    .form-group input:focus { outline: none; border-color: #2563eb; }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 15px;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .divider { display: flex; align-items: center; margin: 20px 0; color: #9ca3af; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e5e7eb; }
    .divider span { padding: 0 10px; }
    .google-btn {
      width: 100%;
      padding: 12px;
      background: white;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      font-weight: 600;
      color: #374151;
    }
    .google-btn:hover { background: #f9fafb; }
    .hidden { display: none; }
    .error-msg { color: #dc2626; background: #fee2e2; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; }
    .footer-links {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .footer-links a {
      color: #6b7280;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .footer-links a:hover { color: #2563eb; text-decoration: underline; }
  </style>
</head>
<body>
  <!-- LOADER OVERLAY -->
  <div id="page-loader">
    <div class="loader-content">
      <div class="loader-ring"></div>
      <img src="logo.png" alt="Logo" class="loader-logo">
      <p class="loader-text">Laptop Tracker</p>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="container">
    <img src="logo.png" alt="Logo" class="logo-img">
    <h1>Laptop Tracker</h1>
    <p class="subtitle">Track. Protect. Recover.</p>

    <div id="errorBox" class="error-msg hidden"></div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab" onclick="switchTab('register')">Register</button>
    </div>

    <div id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="••••••••">
      </div>
      <button class="btn-primary" onclick="handleLogin()">Login</button>
      <div class="divider"><span>OR</span></div>
      <div id="g_id_onload" data-client_id="725032797775-iam91nooik7abniqg41hjejso90f2asr.apps.googleusercontent.com" data-callback="handleGoogleCredentialResponse" data-auto_prompt="false"></div>
      <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="large" data-logo_alignment="left"></div>
    </div>

    <div id="registerForm" class="hidden">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPass" placeholder="••••••••">
      </div>
      <button class="btn-primary" onclick="handleRegister()">Create Account</button>
    </div>

    <div class="footer-links">
      <a href="/important.html">Important</a>
      <a href="/terms.html">Terms</a>
      <a href="/about.html">About</a>
    </div>
  </div>

  <script>
    // LOADER: Hide when page fully loads
    window.addEventListener('load', () => {
      const loader = document.getElementById('page-loader');
      loader.style.opacity = '0';
      setTimeout(() => loader.style.display = 'none', 500);
    });

    window.switchTab = (tab) => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
      document.getElementById('errorBox').classList.add('hidden');
    };

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.classList.remove('hidden');
    }

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPass').value;
      if (!email || !password) return showError("Please fill in all fields");
      
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token', data.token);
          window.location.href = '/dashboard';
        } else showError(data.error);
      } catch (err) { showError("Network error"); }
    }

    async function handleRegister() {
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPass').value;
      if (!name || !email || !password) return showError("Please fill in all fields");

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token', data.token);
          window.location.href = '/dashboard';
        } else showError(data.error);
      } catch (err) { showError("Network error"); }
    }

    async function handleGoogleCredentialResponse(response) {
      try {
        const res = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token', data.token);
          window.location.href = '/dashboard';
        } else showError("Google login failed");
      } catch (err) { showError("Network error"); }
    }
  </script>
</body>
</html>
