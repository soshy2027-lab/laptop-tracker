<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Laptop Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { background: #1e1e24; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); width: 100%; max-width: 450px; padding: 25px; color: white; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h1 { font-size: 22px; font-weight: bold; }
    .tier { color: #a0a0a0; font-size: 14px; margin-top: 5px; }
    .upgrade-btn { background: white; color: #1e1e24; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; cursor: pointer; text-decoration: none; }
    .upgrade-btn:hover { background: #f0f0f0; }
    .limit-section { margin-top: 20px; }
    .limit-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #333; }
    .limit-row:last-child { border-bottom: none; }
    .limit-label { display: flex; align-items: center; gap: 10px; font-size: 15px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
    .dot-gray { background: #666; }
    .limit-value { font-size: 15px; color: #d1d5db; }
    .btn-back { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 25px; }
    .btn-back:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>Transactional</h1>
        <p class="tier">Free</p>
      </div>
      <a href="/subscription" class="upgrade-btn">Upgrade</a>
    </div>

    <div class="limit-section">
      <div class="limit-row">
        <div class="limit-label"><span class="dot"></span> Monthly limit</div>
        <div class="limit-value">2 / 3,000</div>
      </div>
      <div class="limit-row" style="padding-top: 0;">
        <div class="limit-label" style="padding-left: 18px;">Sending</div>
        <div class="limit-value">2</div>
      </div>
      <div class="limit-row" style="padding-top: 0;">
        <div class="limit-label" style="padding-left: 18px;">Receiving</div>
        <div class="limit-value">0</div>
      </div>
      
      <div class="limit-row">
        <div class="limit-label"><span class="dot dot-gray"></span> Daily limit</div>
        <div class="limit-value">0 / 100</div>
      </div>
    </div>

    <button class="btn-back" onclick="window.location.href='/dashboard'">← Back to Dashboard</button>
  </div>
</body>
</html>
