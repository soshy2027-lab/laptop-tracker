<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laptop Tracker - Subscribe</title>
  <script src="https://www.paypal.com/sdk/js?client-id=AbLE8U-lM7jO91JGXbLt_U7uGqCkyucJYF8ABXoLdszV-UYFbW8HLzHugKD9AjEG-60dzGJBcfNyAAZO&currency=USD"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    .logo { width: 80px; height: 80px; margin: 0 auto 15px; object-fit: contain; }
    h1 { color: #2563eb; margin-bottom: 10px; }
    p { color: #6b7280; margin-bottom: 20px; }
    
    .plan-box {
      background: #f8fafc;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .price { font-size: 2.5rem; font-weight: bold; color: #111827; }
    .alt-price { font-size: 1.1rem; color: #6b7280; margin-top: 5px; }
    .period { color: #6b7280; font-size: 0.9rem; }
    .features { text-align: left; margin: 15px 0; list-style: none; }
    .features li { margin: 8px 0; color: #374151; font-size: 0.9rem; }
    .features li::before { content: "✅ "; }
    
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 10px;
      transition: transform 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-mpesa { background: #4ade80; color: #064e3b; }
    .btn-paypal { background: #0070ba; color: white; }
    .btn-back { background: #e5e7eb; color: #374151; }
    
    .loading { display: none; margin-top: 10px; color: #2563eb; }
    .error { color: #dc2626; background: #fee2e2; padding: 10px; border-radius: 8px; margin-top: 10px; display: none; }
    #paypal-button-container { margin-top: 15px; }
    
    .or-divider {
      margin: 15px 0;
      color: #6b7280;
      font-weight: 500;
      position: relative;
    }
    .or-divider::before, .or-divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #e5e7eb;
    }
    .or-divider::before { left: 0; }
    .or-divider::after { right: 0; }
  </style>
</head>
<body>
  <div class="container">
    <img src="/logo.png" alt="Logo" class="logo">
    <h1>Upgrade to Pro</h1>
    <p>Get full access to Laptop Tracker features.</p>

    <div class="plan-box">
      <div class="price" id="mainPrice">KES 2,500</div>
      <div class="alt-price" id="altPrice">or $20 USD</div>
      <div class="period">Every 4 Months</div>
      <ul class="features">
        <li>Unlimited Laptop Tracking</li>
        <li>Real-time GPS & IP Location</li>
        <li>Stolen Device Alerts</li>
        <li>Priority Support</li>
      </ul>
    </div>

    <div id="loading" class="loading">Processing payment...</div>
    <div id="error" class="error"></div>

    <!-- ALWAYS SHOW BOTH OPTIONS -->
    <button class="btn btn-mpesa" onclick="payMpesa()">📱 Pay with M-Pesa (KES 2,500)</button>
    
    <div class="or-divider">OR</div>
    
    <div id="paypal-button-container"></div>
    
    <button class="btn btn-back" onclick="window.location.href='/dashboard'">← Back to Dashboard</button>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const auth = { 'Authorization': `Bearer ${token}` };
    if (!token) window.location.href = '/';

    function showError(msg) {
      const err = document.getElementById('error');
      err.textContent = msg; err.style.display = 'block';
    }

    // 📱 M-Pesa Payment
    window.payMpesa = async () => {
      const phone = prompt("Enter M-Pesa Number (e.g., 0712345678):");
      if (!phone) return;
      document.getElementById('loading').style.display = 'block';
      document.getElementById('error').style.display = 'none';
      try {
        const res = await fetch('/api/mpesa/pay', {
          method: 'POST', headers: { ...auth, 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone })
        });
        const data = await res.json();
        if (res.ok) alert('Check your phone for the STK Push!');
        else showError(data.error || 'Payment failed');
      } catch (e) { showError('Network error'); }
      document.getElementById('loading').style.display = 'none';
    };

    // 💳 PayPal Payment
    paypal.Buttons({
      createOrder: async () => {
        try {
          const res = await fetch('/api/paypal/create-order', { method: 'POST', headers: auth });
          const data = await res.json();
          console.log('PayPal Order Response:', data);
          if (!res.ok) {
            showError(data.error || 'Server error creating order');
            throw new Error(data.error || 'Server error');
          }
          if (!data.id) {
            showError('Invalid response from server');
            throw new Error('No order ID');
          }
          return data.id;
        } catch (err) { 
          console.error('PayPal createOrder error:', err);
          showError('Failed to create PayPal order: ' + err.message);
          throw err;
        }
      },
      onApprove: async (data) => {
        document.getElementById('loading').style.display = 'block';
        try {
          const res = await fetch('/api/paypal/capture-order', {
            method: 'POST', headers: { ...auth, 'Content-Type': 'application/json' },
            body: JSON.stringify({ orderID: data.orderID })
          });
          const result = await res.json();
          if (result.status === 'COMPLETED') {
            alert('Payment Successful! Subscription Activated.');
            window.location.href = '/dashboard?payment=success';
          } else { showError('Payment failed or cancelled'); }
        } catch (err) { showError('Error processing payment'); }
        document.getElementById('loading').style.display = 'none';
      }
    }).render('#paypal-button-container');
  </script>
</body>
</html>
