<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laptop Tracker - Auto Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      object-fit: contain;
    }
    h1 { color: #2563eb; margin-bottom: 10px; }
    .status {
      margin: 20px 0;
      padding: 20px;
      border-radius: 10px;
      background: #f0fdf4;
      border: 2px solid #16a34a;
    }
    .status.active {
      background: #f0fdf4;
      border-color: #16a34a;
    }
    .status.error {
      background: #fef2f2;
      border-color: #dc2626;
    }
    .status h3 {
      color: #16a34a;
      margin-bottom: 10px;
    }
    .status.error h3 {
      color: #dc2626;
    }
    .info {
      text-align: left;
      margin: 20px 0;
      padding: 15px;
      background: #f8fafc;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .info p {
      margin: 5px 0;
      color: #475569;
    }
    .pulse {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: #16a34a;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }
    .btn {
      background: #2563eb;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin: 5px;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { background: #1d4ed8; }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <img src="/logo.png" alt="Logo" class="logo">
    <h1>Laptop Tracker</h1>
    <p style="color: #6b7280; margin-bottom: 20px;">Auto-Tracking System</p>

    <div id="setupSection">
      <p style="margin-bottom: 15px;">Enter your Laptop ID to start tracking:</p>
      <input type="text" id="laptopId" placeholder="Laptop ID (from your dashboard)">
      <button class="btn" onclick="startTracking()">Start Tracking</button>
    </div>

    <div id="trackingSection" class="hidden">
      <div class="status active" id="statusBox">
        <h3><span class="pulse"></span>Tracking Active</h3>
        <p>Auto-checking location every 5 minutes</p>
      </div>

      <div class="info">
        <p><strong>Last Check:</strong> <span id="lastCheck">Never</span></p>
        <p><strong>Location:</strong> <span id="location">Waiting...</span></p>
        <p><strong>IP Address:</strong> <span id="ipAddress">Detecting...</span></p>
      </div>

      <button class="btn" onclick="checkNow()" style="background: #10b981;">Check Now</button>
      <button class="btn" onclick="stopTracking()" style="background: #dc2626;">Stop</button>
    </div>
  </div>

  <script>
    let laptopId = localStorage.getItem('trackerLaptopId');
    let checkInterval = null;

    if (laptopId) {
      document.getElementById('setupSection').classList.add('hidden');
      document.getElementById('trackingSection').classList.remove('hidden');
      startAutoCheck();
    }

    window.startTracking = () => {
      laptopId = document.getElementById('laptopId').value.trim();
      if (!laptopId) {
        alert('Please enter a Laptop ID');
        return;
      }
      localStorage.setItem('trackerLaptopId', laptopId);
      document.getElementById('setupSection').classList.add('hidden');
      document.getElementById('trackingSection').classList.remove('hidden');
      startAutoCheck();
      checkNow();
    };

    window.startAutoCheck = () => {
      checkNow();
      checkInterval = setInterval(checkNow, 300000); // Every 5 minutes
    };

    window.checkNow = async () => {
      try {
        const response = await fetch(`/api/laptops/${laptopId}/checkin`);
        const data = await response.json();
        
        if (response.ok) {
          document.getElementById('lastCheck').textContent = new Date().toLocaleTimeString();
          document.getElementById('location').textContent = data.location ? 
            `${data.location.city}, ${data.location.country}` : 'Location unavailable';
          document.getElementById('ipAddress').textContent = data.ip || 'Unknown';
          
          const statusBox = document.getElementById('statusBox');
          statusBox.className = 'status active';
          statusBox.innerHTML = '<h3><span class="pulse"></span>Tracking Active</h3><p>Auto-checking location every 5 minutes</p>';
        } else {
          throw new Error(data.error || 'Check-in failed');
        }
      } catch (err) {
        console.error('Tracking error:', err);
        const statusBox = document.getElementById('statusBox');
        statusBox.className = 'status error';
        statusBox.innerHTML = '<h3>⚠️ Tracking Error</h3><p>' + err.message + '</p>';
      }
    };

    window.stopTracking = () => {
      if (checkInterval) {
        clearInterval(checkInterval);
      }
      localStorage.removeItem('trackerLaptopId');
      document.getElementById('setupSection').classList.remove('hidden');
      document.getElementById('trackingSection').classList.add('hidden');
      document.getElementById('laptopId').value = '';
    };
  </script>
</body>
</html>
